name: CloudCost Azure

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'ID de CloudCost CI concluído com sucesso em push main (não PR/fork/schedule)'
        required: true
        type: string
  schedule:
    # Somente rescan do digest ativo. Nunca provisiona nem atualiza o app.
    - cron: '47 5 * * *'

permissions: {}

concurrency:
  group: cloudcost-azure-production
  cancel-in-progress: false

jobs:
  source:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      source_sha: ${{ steps.source.outputs.source_sha }}
      artifact_id: ${{ steps.source.outputs.artifact_id }}
      run_id: ${{ steps.source.outputs.run_id }}
    steps:
      - name: Checkout do código de entrega confiável
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Autorizar origem exata do artefato
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.run_id }}
        run: bash scripts/azure-source-run.sh "$SOURCE_RUN_ID"
      - name: Evidência de autorização, inclusive falha
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: azure-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: azure-evidence/
          if-no-files-found: warn
          retention-days: 14

  deploy:
    needs: source
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment:
      name: azure-production
      url: ${{ steps.deploy.outputs.endpoint }}
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
      AZURE_ACR_NAME: ${{ vars.AZURE_ACR_NAME }}
      AZURE_ACR_LOGIN_SERVER: ${{ vars.AZURE_ACR_LOGIN_SERVER }}
      AZURE_CONTAINER_APP_NAME: ${{ vars.AZURE_CONTAINER_APP_NAME }}
      AZURE_ENVIRONMENT_NAME: ${{ vars.AZURE_ENVIRONMENT_NAME }}
      AZURE_PULL_IDENTITY_NAME: ${{ vars.AZURE_PULL_IDENTITY_NAME }}
    steps:
      - name: Checkout do código de entrega confiável
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Revalidar origem após a proteção do environment
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ needs.source.outputs.run_id }}
          EXPECTED_ARTIFACT_ID: ${{ needs.source.outputs.artifact_id }}
        run: |
          bash scripts/azure-source-run.sh "$SOURCE_RUN_ID"
          test "$(jq -r '.[0].id' azure-evidence/source-artifact.json)" = "$EXPECTED_ARTIFACT_ID"
      - name: Baixar apenas o artefato imutável do run autorizado
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.source.outputs.artifact_id }}
          run-id: ${{ needs.source.outputs.run_id }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/cloudcost-image
          merge-multiple: true
          digest-mismatch: error
      - name: Validar archive e carregar sem executar a imagem
        id: prepare
        env:
          ARTIFACT_DIRECTORY: ${{ runner.temp }}/cloudcost-image
          SOURCE_SHA: ${{ needs.source.outputs.source_sha }}
        run: bash scripts/azure-deploy.sh prepare "$ARTIFACT_DIRECTORY" "$SOURCE_SHA"
      - name: Login federado sem segredo Azure
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Instalar versão fixa do compilador Bicep
        run: az bicep install --version v0.48.1
      - name: Publicar imagem comprovada, aguardar revisão READY e smoke HTTPS
        id: deploy
        env:
          LOADED_IMAGE_ID: ${{ steps.prepare.outputs.loaded_image_id }}
          CONFIG_DIGEST: ${{ steps.prepare.outputs.config_digest }}
          SOURCE_SHA: ${{ needs.source.outputs.source_sha }}
          SOURCE_RUN_ID: ${{ needs.source.outputs.run_id }}
        run: bash scripts/azure-deploy.sh deploy "$LOADED_IMAGE_ID" "$CONFIG_DIGEST" "$SOURCE_SHA" "$SOURCE_RUN_ID"
      - name: Registrar resultado da tentativa
        if: always()
        env:
          RESULT: ${{ job.status }}
          SOURCE_RUN_ID: ${{ needs.source.outputs.run_id }}
          SOURCE_SHA: ${{ needs.source.outputs.source_sha }}
        run: |
          mkdir -p azure-evidence
          jq -n --arg status "$RESULT" --arg run "$SOURCE_RUN_ID" --arg sha "$SOURCE_SHA" '{status:$status,source_run_id:$run,source_sha:$sha}' > azure-evidence/workflow-status.json
      - name: Evidência da implantação, inclusive falha
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: azure-deployment-${{ github.run_id }}-${{ github.run_attempt }}
          path: azure-evidence/
          if-no-files-found: error
          retention-days: 14

  rescan:
    if: github.event_name == 'schedule' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: azure-production
    permissions:
      contents: read
      id-token: write
    env:
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
      AZURE_ACR_NAME: ${{ vars.AZURE_ACR_NAME }}
      AZURE_ACR_LOGIN_SERVER: ${{ vars.AZURE_ACR_LOGIN_SERVER }}
      AZURE_CONTAINER_APP_NAME: ${{ vars.AZURE_CONTAINER_APP_NAME }}
      AZURE_ENVIRONMENT_NAME: ${{ vars.AZURE_ENVIRONMENT_NAME }}
      AZURE_PULL_IDENTITY_NAME: ${{ vars.AZURE_PULL_IDENTITY_NAME }}
    steps:
      - name: Checkout do código de análise confiável
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Login federado para ler app e imagem privada
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Reexaminar o digest exato implantado, sem rebuild/deploy
        run: bash scripts/azure-deploy.sh rescan
      - name: Registrar resultado do rescan
        if: always()
        env:
          RESULT: ${{ job.status }}
        run: |
          mkdir -p azure-evidence
          jq -n --arg status "$RESULT" '{status:$status,operation:"rescan"}' > azure-evidence/workflow-status.json
      - name: Evidências de vulnerabilidade, SBOM e DAST, inclusive falha
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: azure-rescan-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            azure-evidence/
            reports/
            !reports/**/image.tar
          if-no-files-found: error
          retention-days: 14
