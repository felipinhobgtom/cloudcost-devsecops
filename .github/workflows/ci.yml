name: CloudCost CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "23 5 * * *"

permissions:
  contents: read

concurrency:
  group: cloudcost-ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  checks:
    name: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Obter histórico completo sem persistir credenciais
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Instalar toolchain Go fixada
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.3"
          cache: false

      - name: Qualidade, segurança, build único e DAST
        id: security
        run: bash scripts/security-checks.sh

      - name: Preservar relatórios mesmo em caso de falha
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: security-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            reports/
            !reports/**/image.tar
          if-no-files-found: error
          retention-days: 14

      - name: Entregar somente o artefato aprovado para Azure
        if: success() && github.ref == 'refs/heads/main' && github.event_name != 'schedule'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cloudcost-image
          path: |
            ${{ steps.security.outputs.report-dir }}/image.tar
            ${{ steps.security.outputs.report-dir }}/image.tar.sha256
            ${{ steps.security.outputs.report-dir }}/image-identity.json
            ${{ steps.security.outputs.report-dir }}/image-inspect.json
            ${{ steps.security.outputs.report-dir }}/summary.json
            ${{ steps.security.outputs.report-dir }}/sbom.cdx.json
            ${{ steps.security.outputs.report-dir }}/trivy-image.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  security-gate:
    name: security-gate
    if: always()
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Bloquear entrega se qualquer gate falhar ou não executar
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
        run: |
          set -euo pipefail
          if [[ "$CHECKS_RESULT" != "success" ]]; then
            printf 'Gate bloqueado: checks=%s\n' "$CHECKS_RESULT" >&2
            exit 1
          fi
          printf 'Todos os gates obrigatórios foram aprovados nesta execução.\n'
