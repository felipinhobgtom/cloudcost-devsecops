name: cloudcost

services:
  app:
    image: ${CLOUDCOST_IMAGE:-cloudcost:local}
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      PORT: "8080"
    user: "65532:65532"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 128m
    cpus: 0.50
    restart: unless-stopped
    stop_grace_period: 10s
    healthcheck:
      test: ["CMD", "/cloudcost", "healthcheck"]
      interval: 15s
      timeout: 3s
      start_period: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
